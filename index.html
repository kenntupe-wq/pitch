<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Alder Security</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff88;
    --green-dim: #00c860;
    --red: #ff3344;
    --amber: #ffaa00;
    --dark: #080c0a;
    --dark2: #0d1410;
    --dark3: #111a14;
    --panel: rgba(0,255,136,0.04);
    --border: rgba(0,255,136,0.12);
    --text: #c8e8d4;
    --text-dim: #5a7a66;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    width: 100%; height: 100%;
    background: var(--dark);
    font-family: 'Rajdhani', sans-serif;
    color: var(--text);
    overflow: hidden;
    user-select: none;
  }

  /* ── SLIDE SYSTEM ── */
  #slides { width: 100%; height: 100%; position: relative; }

  .slide {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity 0.5s ease, transform 0.5s cubic-bezier(.4,0,.2,1);
    transform: translateX(40px);
  }
  .slide.active { opacity: 1; pointer-events: all; transform: translateX(0); }
  .slide.exit { opacity: 0; transform: translateX(-40px); }

  /* ── GLOBAL NAV ── */
  #nav {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 10px; z-index: 100;
  }
  .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--text-dim); transition: all 0.3s; cursor: pointer;
  }
  .dot.active { background: var(--green); box-shadow: 0 0 8px var(--green); width: 24px; border-radius: 4px; }

  #tap-hint {
    position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
    font-family: 'Share Tech Mono', monospace; font-size: 10px; color: var(--text-dim);
    letter-spacing: 2px; text-transform: uppercase; animation: blink 2s ease infinite;
    pointer-events: none; z-index: 100;
  }
  @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:.8} }

  #tap-left, #tap-right { position: fixed; top: 0; width: 25%; height: 100%; z-index: 50; cursor: pointer; }
  #tap-left { left: 0; }
  #tap-right { right: 0; }

  .scanline { position: absolute; inset: 0; pointer-events: none; z-index: 10; overflow: hidden; }
  .scanline::after {
    content:''; position: absolute; left:0; right:0; top:-100%; height: 40%;
    background: linear-gradient(transparent, rgba(0,255,136,0.02), transparent); animation: scan 6s linear infinite;
  }
  @keyframes scan { to { top: 200%; } }

  /* ── CONTROLS ── */
  #clock { position: fixed; top: 20px; left: 20px; z-index: 200; font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--text-dim); }
  #edit-btn {
    position: fixed; top: 20px; right: 20px; z-index: 200; background: rgba(0,0,0,.6); border: 1px solid var(--border);
    color: var(--text-dim); border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px; transition: all 0.2s;
  }
  #edit-btn.active { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 10px rgba(255,170,0,0.3); }

  /* ── EDIT MODE STYLES ── */
  body.edit-mode .editable { position: relative; cursor: pointer; }
  body.edit-mode .editable::after {
    content: '+ ADD PHOTO'; position: absolute; inset: 0; background: rgba(255,170,0,0.2);
    border: 2px dashed var(--amber); color: var(--amber); display: flex; align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace; font-size: 12px; font-weight: bold; opacity: 0; transition: opacity 0.2s; border-radius: inherit; z-index: 20;
  }
  body.edit-mode .editable:hover::after { opacity: 1; }
  .media-slot { width: 100%; height: 100%; object-fit: contain; background: rgba(255,255,255,0.01); display: block; }
  .cam-feed .media-slot { object-fit: cover; }

  /* ── SLIDE 1: HERO ── */
  #s1 { background: var(--dark); justify-content: center; align-items: center; }
  #s1 .bg-grid {
    position: absolute; inset: 0; background-image: linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px); background-size: 50px 50px;
  }
  #s1 .hero-content { position: relative; z-index: 2; text-align: center; }
  #s1 .shield { width: 80px; height: 80px; margin: 0 auto 20px; filter: drop-shadow(0 0 20px var(--green)); }
  #s1 h1 { font-family: 'Bebas Neue', sans-serif; font-size: 80px; letter-spacing: 10px; color: #fff; line-height: 1; }
  #s1 .tagline { font-family: 'Share Tech Mono', monospace; font-size: 12px; letter-spacing: 4px; color: var(--green); margin-top: 12px; }
  .status-bar { margin-top: 40px; display: flex; gap: 24px; justify-content: center; }
  .stat-pill { display: flex; flex-direction: column; align-items: center; background: rgba(0,0,0,0.4); padding: 8px 16px; border-radius: 4px; border: 1px solid var(--border); }
  .stat-pill .num { font-family: 'Bebas Neue', sans-serif; font-size: 32px; color: var(--green); line-height: 1; }
  .stat-pill .lbl { font-family: 'Share Tech Mono', monospace; font-size: 9px; color: var(--text-dim); letter-spacing: 1px; text-transform: uppercase; margin-top: 4px; }

  /* ── SLIDE 2: HARDWARE ECOSYSTEM (GRID) ── */
  #s2 { background: #050806; padding: 20px 24px 70px; }
